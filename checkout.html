<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | SkinVault by Chi</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/skinvault.css">
<link rel="stylesheet" href="/style.css">
<style>
  .co-wrap{max-width:1080px;margin:0 auto;padding:40px clamp(20px,4vw,56px) 90px}
  .co-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(30px,5vw,70px);align-items:start}
  @media(max-width:900px){.co-grid{grid-template-columns:1fr}}
  .field{margin-bottom:16px}
  .field label{display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8a7638;margin-bottom:7px}
  .field input,.field select{width:100%;font-family:'DM Mono',monospace;font-size:14px;padding:13px 14px;border:1px solid rgba(33,30,26,.2);background:#fff;color:#211E1A}
  .sum{border:1px solid rgba(33,30,26,.14);background:#fff;padding:26px}
  .sum-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed rgba(33,30,26,.12);font-size:16px}
  .sum-tot{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:14px;padding:8px 0}
  .err{display:none;background:#fdf0ee;border:1px solid #d8a79e;color:#7c2d1f;padding:13px 16px;font-family:'DM Mono',monospace;font-size:12.5px;margin:0 0 18px}
</style>
</head>
<body class="sec-light" style="background:#FBF9F4;color:#211E1A">
<main id="main" class="co-wrap">
  <p style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8a7638;margin-bottom:14px"><a href="shop.html" style="color:inherit">← Back to the vault</a></p>
  <h1 style="font-size:clamp(34px,4.5vw,52px);font-weight:500;margin-bottom:34px">Checkout</h1>
  <div id="co-error" class="err" role="alert"></div>
  <div class="co-grid">
    <form id="co-form" novalidate>
      <div class="field"><label for="f-name">Full name</label><input id="f-name" name="name" autocomplete="name" required></div>
      <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="f-phone">Phone (for delivery)</label><input id="f-phone" name="phone" type="tel" autocomplete="tel" placeholder="+234..." required></div>
      <div class="field"><label for="f-address">Delivery address</label><input id="f-address" name="address" autocomplete="street-address" required></div>
      <div class="field"><label for="f-city">City</label><input id="f-city" name="city" autocomplete="address-level2"></div>
      <div class="field"><label for="f-zone">Delivery zone</label>
        <select id="f-zone" name="zone">
          <option value="lagos">Lagos</option>
          <option value="nationwide">Outside Lagos (nationwide)</option>
        </select>
      </div>
      <button id="co-pay" class="btn btn-gold" type="submit" style="width:100%;background:#C9A84C;color:#1A1A1A;border:1px solid #C9A84C;font-family:'DM Mono',monospace;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;padding:17px;cursor:pointer;margin-top:8px">Pay securely with Paystack</button>
      <p style="font-family:'DM Mono',monospace;font-size:10.5px;color:#6E6656;margin-top:12px">Card, bank transfer or USSD · you'll be redirected to Paystack and back.</p>
    </form>
    <aside class="sum" aria-label="Order summary">
      <h2 style="font-size:24px;font-weight:600;margin-bottom:12px">Your order</h2>
      <div id="sum-items"></div>
      <div style="margin-top:12px">
        <div class="sum-tot"><span>Subtotal</span><span id="sum-sub"></span></div>
        <div class="sum-tot"><span>Delivery</span><span id="sum-del"></span></div>
        <div class="sum-tot" style="border-top:1px solid rgba(33,30,26,.2);margin-top:6px;padding-top:12px;font-size:16px"><strong>Total</strong><strong id="sum-tot"></strong></div>
      </div>
      <p style="font-family:'DM Mono',monospace;font-size:10.5px;color:#6E6656;margin-top:14px">Free delivery on orders over ₦150,000. Prices are confirmed server-side at payment.</p>
    </aside>
  </div>
</main>
<script src="assets/cart.js"></script>
<script>
(function(){
  var FEES={lagos:3500,nationwide:6000},FREE_OVER=150000;
  var itemsEl=document.getElementById('sum-items');
  function refresh(){
    var c=SVCart.load();
    if(!c.length){itemsEl.innerHTML='<p style="color:#6E6656;padding:10px 0">Your cart is empty — <a href="shop.html" style="border-bottom:1px solid #8a7638">back to the vault</a>.</p>';} 
    else itemsEl.innerHTML=c.map(function(i){return '<div class="sum-row"><span>'+i.qty+'× '+i.name.replace(/</g,'&lt;')+'</span><span style="font-family:DM Mono,monospace;font-size:12.5px;white-space:nowrap">'+SVCart.naira(i.price*i.qty)+'</span></div>';}).join('');
    var sub=SVCart.subtotal(c);
    var zone=document.getElementById('f-zone').value;
    var del=(FREE_OVER&&sub>=FREE_OVER)?0:FEES[zone]||FEES.nationwide;
    document.getElementById('sum-sub').textContent=SVCart.naira(sub);
    document.getElementById('sum-del').textContent=del===0?'Free':SVCart.naira(del);
    document.getElementById('sum-tot').textContent=SVCart.naira(sub+del);
    document.getElementById('co-pay').disabled=!c.length;
  }
  document.getElementById('f-zone').addEventListener('change',refresh);
  refresh();
  document.getElementById('co-form').addEventListener('submit',function(e){
    e.preventDefault();
    var err=document.getElementById('co-error');err.style.display='none';
    var btn=document.getElementById('co-pay');btn.disabled=true;btn.textContent='One moment…';
    var c=SVCart.load();
    fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      name:document.getElementById('f-name').value,
      email:document.getElementById('f-email').value,
      phone:document.getElementById('f-phone').value,
      address:document.getElementById('f-address').value,
      city:document.getElementById('f-city').value,
      zone:document.getElementById('f-zone').value,
      items:c.map(function(i){return {name:i.sku,qty:i.qty}})
    })}).then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d}})})
    .then(function(x){
      if(x.ok&&x.d.url){location.href=x.d.url;return;}
      err.textContent=x.d.error||'Something went wrong — please try again.';err.style.display='block';
      btn.disabled=false;btn.textContent='Pay securely with Paystack';
    }).catch(function(){
      err.textContent='Network problem — please check your connection and try again.';err.style.display='block';
      btn.disabled=false;btn.textContent='Pay securely with Paystack';
    });
  });
})();
</script>
</body>
</html>
